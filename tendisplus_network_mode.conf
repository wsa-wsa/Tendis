# Tendisplus Configuration - Network Transfer Mode
# =================================================
# This configuration uses network transfer for remote compaction
# No shared filesystem (NFS/HDFS) is required
# SST files are transferred over gRPC between Tendis and CSA

# Basic server settings
port 51002
daemon off
loglevel notice
logdir ./home/log
dumpdir ./home/dump
dir ./home/db
pidfile ./home/tendisplus.pid
slowlog ./home/log/slowlog

# Performance settings
rocks.blockcachemb 4096
executorThreadNum 48
kvStoreCount 1

# ================================================
# NFS Configuration - DISABLED for network mode
# ================================================
nfs.enabled no
# nfs.url and nfs.local_prefix are not needed in network mode

# ================================================
# Remote Compaction Service (CSA) Configuration
# ================================================
# CSA server address (host:port)
# For local testing: localhost:8010
# For production: <csa-server-ip>:8010
csa_address localhost:8010

# Use network transfer mode - no shared storage needed
remote_compaction.mode network_transfer

# ================================================
# Network Transfer Mode Settings
# ================================================
# CSA server working directory for temporary files
# This directory must exist on the CSA server with sufficient space
remote_compaction.csa_work_dir /tmp/csa_work

# File transfer chunk size in bytes
# 4MB (4194304) is optimal for most networks
# Reduce for high-latency networks, increase for high-bandwidth
remote_compaction.file_transfer_chunk_size 4194304

# Timeout for file transfer operations (seconds)
# Increase for large SST files or slow networks
remote_compaction.file_transfer_timeout 300

# Number of retries for failed file transfers
remote_compaction.file_transfer_retries 3

# ================================================
# CSA Server Settings
# ================================================
# Maximum concurrent compaction tasks
remote_compaction.csa_max_concurrent_tasks 5

# Connection timeout (seconds)
remote_compaction.csa_connection_timeout 30

# Request timeout for compaction operations (seconds)
# Should be longer than expected compaction time
remote_compaction.csa_request_timeout 600

# ================================================
# RocksDB Settings
# ================================================
rocks.blockcachemb 4096
# rocks.max_subcompactions 2

# ================================================
# Debug/Testing Settings (uncomment as needed)
# ================================================
# Enable verbose logging
# loglevel verbose

# Disable direct I/O for debugging
# rocks.use_direct_io_for_flush_and_compaction 0
# rocks.use_direct_reads 0
