syntax = "proto3";

option go_package = "google.golang.org/grpc/examples/csa/csa";
option java_multiple_files = true;
option java_package = "io.grpc.examples.csa";
option java_outer_classname = "CSAProto";

import "google/protobuf/empty.proto";
package csa;

// SST file metadata for network transfer mode (方案三)
// Contains all information needed to build VersionStorageInfo without MANIFEST
message SstFileMetadata {
  string file_name = 1;             // e.g., "000001.sst"
  uint64 file_number = 2;           // file number extracted from file_name
  int32 level = 3;                  // level in LSM tree
  uint64 file_size = 4;             // file size in bytes
  
  // Key range (InternalKey format, serialized)
  bytes smallest_key = 5;           // smallest internal key
  bytes largest_key = 6;            // largest internal key
  
  // Sequence number range
  uint64 smallest_seqno = 7;
  uint64 largest_seqno = 8;
  
  // Additional metadata
  uint64 num_entries = 9;
  uint64 num_deletions = 10;
  uint64 oldest_blob_file_number = 11;
  uint64 oldest_ancester_time = 12;
  uint64 file_creation_time = 13;
  uint64 epoch_number = 14;
  bool marked_for_compaction = 15;
}

message CompactionAdditionInfo {
  double score = 1;
  uint64 num_entries = 2;
  uint64 num_deletions = 3;
  uint64 compensated_file_size = 4;
  int32 output_level = 5;
  int32 start_level = 6;
}

message CompactionReply {
  int32 code = 1;
  string result = 2;
}

message CompactionArgs {
  string name = 1;
  string output_directory = 2;
  string input = 3;
  // Shared filesystem configuration (supports NFS, HDFS, S3, etc.)
  string shared_fs_uri = 4;         // e.g., "nfs://host/path", "hdfs://host:port/path", "s3://bucket/prefix"
  string shared_fs_local_prefix = 5; // local path prefix that maps to shared_fs_uri
  
  // Network transfer mode: transfer SST files over network instead of shared storage
  bool use_network_transfer = 6;    // true = use network transfer, false = use shared storage
  string job_id = 7;                // unique job identifier for file transfer
  
  // Original database path on primary (for symlink mode in network transfer)
  // If CSA can access primary's filesystem, it can symlink MANIFEST files
  string original_db_path = 8;      // e.g., "/data/tendisplus/db/0"
  
  // SST file metadata for network transfer mode (方案三)
  // Contains complete file metadata so CSA can build MANIFEST without accessing primary's filesystem
  repeated SstFileMetadata input_file_metadata = 9;
}

// File transfer messages for network transfer mode
message FileChunk {
  string job_id = 1;
  string file_name = 2;             // relative file path (e.g., "000001.sst")
  uint64 offset = 3;                // offset in file
  bytes data = 4;                   // file content chunk
  bool is_last_chunk = 5;           // true if this is the last chunk of the file
  uint64 total_size = 6;            // total file size
}

message FileTransferRequest {
  string job_id = 1;
  repeated string file_names = 2;   // list of files to download from CSA
}

message FileTransferResponse {
  int32 code = 1;
  string message = 2;
}

message FileListRequest {
  string job_id = 1;
}

message FileListResponse {
  int32 code = 1;
  repeated string file_names = 2;   // list of output files generated by compaction
  repeated uint64 file_sizes = 3;   // corresponding file sizes
}

message CompactionTaskArgs {
  uint64 task_id = 1;
  CompactionArgs compaction_args = 2;
}

message SubmitTaskArgs {
  uint64 task_id = 1;
  CompactionReply compaction_reply = 2;
}

message CSAStatus {
  string ip = 1;
  uint32 port = 2;
  uint64 local_task_nums = 3;
  uint64 max_task_nums = 4;
  double memory_usage = 5;
}

message CompactionJobInfo {
  CompactionArgs compaction_args = 1;
  CompactionAdditionInfo compaction_addition_info = 2;
};

service CSAService {
  rpc ExecuteCompactionTask(CompactionArgs) returns (CompactionReply) {}
  
  // Network transfer mode RPCs
  // Upload input SST files from client to CSA server
  rpc UploadFile(stream FileChunk) returns (FileTransferResponse) {}
  
  // Download output SST files from CSA server to client
  rpc DownloadFile(FileTransferRequest) returns (stream FileChunk) {}
  
  // Get list of output files after compaction completes
  rpc GetOutputFiles(FileListRequest) returns (FileListResponse) {}
  
  // Cleanup job files on CSA server
  rpc CleanupJob(FileListRequest) returns (FileTransferResponse) {}
}
