// Control Plane gRPC Service Definition
// Based on CaaS-LSM architecture: Compaction-as-a-Service

syntax = "proto3";

package control_plane;

// ============================================================================
// Control Plane Service - 控制平面服务
// Tendisplus 节点通过此服务提交 compaction 任务
// CSA Worker 通过此服务注册和上报结果
// ============================================================================
service ControlPlaneService {
  // =========================================================================
  // Tendisplus Node API - DB节点调用的接口
  // =========================================================================
  
  // 提交 Compaction 任务
  rpc SubmitCompactionTask(SubmitTaskRequest) returns (SubmitTaskResponse);
  
  // 查询任务状态
  rpc QueryTaskStatus(QueryTaskRequest) returns (QueryTaskResponse);
  
  // 取消任务
  rpc CancelTask(CancelTaskRequest) returns (CancelTaskResponse);
  
  // 获取任务结果 (阻塞等待或立即返回)
  rpc WaitForTaskResult(WaitResultRequest) returns (WaitResultResponse);

  // =========================================================================
  // CSA Worker API - Worker节点调用的接口
  // =========================================================================
  
  // Worker 注册
  rpc RegisterWorker(RegisterWorkerRequest) returns (RegisterWorkerResponse);
  
  // Worker 心跳
  rpc WorkerHeartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  
  // Worker 注销
  rpc UnregisterWorker(UnregisterWorkerRequest) returns (UnregisterWorkerResponse);
  
  // 上报任务结果
  rpc ReportTaskResult(TaskResultRequest) returns (TaskResultResponse);
  
  // 获取待执行任务 (Worker 拉取模式)
  rpc FetchTask(FetchTaskRequest) returns (FetchTaskResponse);

  // =========================================================================
  // Admin API - 管理接口
  // =========================================================================
  
  // 获取集群状态
  rpc GetClusterStatus(ClusterStatusRequest) returns (ClusterStatusResponse);
  
  // 获取 Worker 列表
  rpc ListWorkers(ListWorkersRequest) returns (ListWorkersResponse);
  
  // 获取任务统计
  rpc GetTaskStatistics(TaskStatisticsRequest) returns (TaskStatisticsResponse);

  // =========================================================================
  // Observatory API - 观测平面接口
  // =========================================================================
  
  // 获取任务列表
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  
  // 获取实时指标快照
  rpc GetMetricsSnapshot(MetricsSnapshotRequest) returns (MetricsSnapshotResponse);
  
  // 获取 Worker 详情
  rpc GetWorkerDetail(WorkerDetailRequest) returns (WorkerDetailResponse);

  // =========================================================================
  // Observatory Enhanced API - 增强观测接口
  // =========================================================================

  // 获取告警列表
  rpc GetAlerts(GetAlertsRequest) returns (GetAlertsResponse);

  // 获取告警规则列表
  rpc GetAlertRules(GetAlertRulesRequest) returns (GetAlertRulesResponse);

  // 获取任务追踪链路
  rpc GetTaskTrace(GetTaskTraceRequest) returns (GetTaskTraceResponse);

  // 获取最近追踪列表
  rpc GetRecentTraces(GetRecentTracesRequest) returns (GetRecentTracesResponse);

  // 获取 Prometheus 格式指标
  rpc GetPrometheusMetrics(PrometheusMetricsRequest) returns (PrometheusMetricsResponse);

  // =========================================================================
  // Bulk Load API - 批量加载接口
  // =========================================================================
  
  // 提交 Bulk Load 任务
  rpc SubmitBulkLoadTask(SubmitBulkLoadRequest) returns (SubmitBulkLoadResponse);
  
  // 查询 Bulk Load 任务状态 (含分片进度)
  rpc QueryBulkLoadStatus(QueryBulkLoadRequest) returns (QueryBulkLoadResponse);
  
  // 取消 Bulk Load 任务
  rpc CancelBulkLoad(CancelBulkLoadRequest) returns (CancelBulkLoadResponse);
  
  // TendisPlus 上报 SST 注入结果
  rpc ReportIngestResult(ReportIngestResultRequest) returns (ReportIngestResultResponse);
}

// ============================================================================
// CaaS-LSM: CSA Service - CSA Worker 暴露的服务接口
// 控制平面通过此服务主动推送任务给 CSA (推送模式)
// ============================================================================
service CSAService {
  // 分发 Compaction 任务 (CaaS-LSM 推送模式)
  rpc DistributeCompactionJob(DistributeJobRequest) returns (DistributeJobResponse);
  
  // 检查 CSA 状态
  rpc CheckCSAStatus(CSAStatusRequest) returns (CSAStatusResponse);
  
  // 取消正在执行的任务
  rpc CancelRunningTask(CancelRunningTaskRequest) returns (CancelRunningTaskResponse);

  // 执行 Bulk Load 分片（SST 生成）
  rpc ExecuteBulkLoadShard(BulkLoadShardRequest) returns (BulkLoadShardResponse);
}

// ============================================================================
// Common Types - 公共类型定义
// ============================================================================

// 任务优先级
enum TaskPriority {
  PRIORITY_LOW = 0;
  PRIORITY_NORMAL = 1;
  PRIORITY_HIGH = 2;
  PRIORITY_URGENT = 3;
}

// 任务状态
enum TaskStatus {
  TASK_UNKNOWN = 0;
  TASK_PENDING = 1;      // 等待调度
  TASK_ASSIGNED = 2;     // 已分配给 Worker
  TASK_RUNNING = 3;      // 正在执行
  TASK_COMPLETED = 4;    // 成功完成
  TASK_FAILED = 5;       // 执行失败
  TASK_CANCELLED = 6;    // 已取消
  TASK_TIMEOUT = 7;      // 超时
  TASK_RETRYING = 8;     // 重试中 (CaaS-LSM: 等待重新调度)
}

// Worker 状态
enum WorkerStatus {
  WORKER_UNKNOWN = 0;
  WORKER_ONLINE = 1;
  WORKER_OFFLINE = 2;
  WORKER_BUSY = 3;
  WORKER_DRAINING = 4;
  WORKER_MAINTENANCE = 5;
}

// Worker 资源信息
message WorkerResources {
  uint32 total_cpu_cores = 1;
  uint64 total_memory_mb = 2;
  uint64 total_disk_mb = 3;
  uint32 used_cpu_cores = 4;
  uint64 used_memory_mb = 5;
  uint64 used_disk_mb = 6;
  uint32 max_concurrent_tasks = 7;
  uint32 active_tasks = 8;
}

// Worker 信息
message WorkerInfo {
  string worker_id = 1;
  string address = 2;              // host:port
  WorkerStatus status = 3;
  WorkerResources resources = 4;
  int64 last_heartbeat_ms = 5;     // Unix timestamp
  int64 register_time_ms = 6;
  uint64 total_completed = 7;
  uint64 total_failed = 8;
  map<string, string> labels = 9;  // 标签，用于亲和性调度
}

// 任务信息
message TaskInfo {
  string task_id = 1;
  string source_node_id = 2;       // 来源 Tendisplus 节点
  string db_name = 3;
  uint32 store_id = 4;
  TaskPriority priority = 5;
  TaskStatus status = 6;
  string assigned_worker_id = 7;
  int64 submit_time_ms = 8;
  int64 start_time_ms = 9;
  int64 complete_time_ms = 10;
  string error_message = 11;
  uint32 retry_count = 12;
}

// ============================================================================
// Tendisplus Node Requests/Responses
// ============================================================================

// 提交任务请求
message SubmitTaskRequest {
  string source_node_id = 1;       // Tendisplus 节点 ID
  string db_name = 2;              // 数据库路径
  uint32 store_id = 3;             // Store ID
  uint64 job_id = 4;               // RocksDB job ID
  string compaction_input = 5;     // 序列化的 compaction 输入
  TaskPriority priority = 6;
  
  // 共享存储配置
  string shared_fs_uri = 7;        // 共享文件系统 URI
  string shared_fs_local_prefix = 8;
  
  // 超时配置
  uint32 timeout_sec = 9;          // 任务超时时间

  // CaaS-LSM 调度参数
  int32 start_level = 10;          // compaction 起始层级
  double score = 11;               // compaction 紧迫度分数
  string compaction_args = 12;     // 原始 compaction 参数
  string compaction_addition_info = 13;  // 附加信息
}

message SubmitTaskResponse {
  bool success = 1;
  string task_id = 2;              // 分配的任务 ID
  string error_message = 3;
}

// 查询任务状态请求
message QueryTaskRequest {
  string task_id = 1;
}

message QueryTaskResponse {
  bool found = 1;
  TaskInfo task_info = 2;
}

// 取消任务请求
message CancelTaskRequest {
  string task_id = 1;
  string reason = 2;
}

message CancelTaskResponse {
  bool success = 1;
  string error_message = 2;
}

// 等待任务结果请求
message WaitResultRequest {
  string task_id = 1;
  uint32 timeout_ms = 2;           // 等待超时，0 表示立即返回
}

message WaitResultResponse {
  bool completed = 1;
  TaskStatus status = 2;
  string compaction_result = 3;    // 序列化的 compaction 结果
  string error_message = 4;
  bool should_fallback = 5;        // CaaS-LSM: 是否应该降级到本地执行
}

// ============================================================================
// CSA Worker Requests/Responses
// ============================================================================

// Worker 注册请求
message RegisterWorkerRequest {
  string worker_id = 1;            // Worker 自定义 ID (可选，控制平面可自动分配)
  string address = 2;              // Worker 地址 host:port
  WorkerResources resources = 3;   // 资源信息
  map<string, string> labels = 4;  // 标签
}

message RegisterWorkerResponse {
  bool success = 1;
  string worker_id = 2;            // 分配或确认的 Worker ID
  string error_message = 3;
  uint32 heartbeat_interval_sec = 4;  // 心跳间隔
}

// 心跳请求
message HeartbeatRequest {
  string worker_id = 1;
  WorkerResources resources = 2;   // 更新的资源信息
  repeated string active_task_ids = 3;  // 当前活跃任务列表
}

message HeartbeatResponse {
  bool success = 1;
  repeated string tasks_to_cancel = 2;  // 需要取消的任务列表
}

// 注销请求
message UnregisterWorkerRequest {
  string worker_id = 1;
  string reason = 2;
}

message UnregisterWorkerResponse {
  bool success = 1;
}

// 上报任务结果
message TaskResultRequest {
  string worker_id = 1;
  string task_id = 2;
  bool success = 3;
  string compaction_result = 4;    // 成功时的 compaction 结果
  string error_message = 5;        // 失败时的错误信息
  uint64 execution_time_ms = 6;    // 执行耗时
  uint64 bytes_read = 7;           // 读取字节数
  uint64 bytes_written = 8;        // 写入字节数
}

message TaskResultResponse {
  bool success = 1;
  string error_message = 2;
}

// 获取待执行任务 (Worker 拉取模式)
message FetchTaskRequest {
  string worker_id = 1;
  uint32 max_tasks = 2;            // 最多获取任务数
}

message FetchTaskResponse {
  repeated CompactionTask tasks = 1;
}

// Compaction 任务详情 (发送给 Worker)
message CompactionTask {
  string task_id = 1;
  string db_name = 2;
  uint32 store_id = 3;
  uint64 job_id = 4;
  string compaction_input = 5;
  string shared_fs_uri = 6;
  string shared_fs_local_prefix = 7;
  uint32 timeout_sec = 8;
}

// ============================================================================
// Admin Requests/Responses
// ============================================================================

// 集群状态请求
message ClusterStatusRequest {}

message ClusterStatusResponse {
  uint32 total_workers = 1;
  uint32 online_workers = 2;
  uint32 pending_tasks = 3;
  uint32 running_tasks = 4;
  uint64 total_completed = 5;
  uint64 total_failed = 6;
}

// Worker 列表请求
message ListWorkersRequest {
  WorkerStatus status_filter = 1;  // 0 表示全部
}

message ListWorkersResponse {
  repeated WorkerInfo workers = 1;
}

// 任务统计请求
message TaskStatisticsRequest {
  int64 since_time_ms = 1;         // 统计起始时间，0 表示全部
}

message TaskStatisticsResponse {
  uint64 total_submitted = 1;
  uint64 total_completed = 2;
  uint64 total_failed = 3;
  uint64 total_cancelled = 4;
  uint64 total_timeout = 5;
  uint64 avg_execution_time_ms = 6;
  uint64 avg_queue_time_ms = 7;
  map<string, uint64> tasks_per_worker = 8;
}

// ============================================================================
// Observatory API - 观测平面接口
// ============================================================================

// 获取任务列表请求
message ListTasksRequest {
  TaskStatus status_filter = 1;    // 0 表示全部
  uint32 limit = 2;                // 最大返回数量，默认 100
  string source_node_filter = 3;   // 按来源节点过滤
}

message ListTasksResponse {
  repeated TaskInfo tasks = 1;
}

// 实时指标请求
message MetricsSnapshotRequest {}

message MetricsSnapshotResponse {
  // 集群概览
  uint32 total_workers = 1;
  uint32 online_workers = 2;
  uint32 busy_workers = 3;
  uint32 pending_tasks = 4;
  uint32 running_tasks = 5;
  
  // 吞吐量统计
  uint64 total_completed = 6;
  uint64 total_failed = 7;
  uint64 completed_last_minute = 8;   // 最近 1 分钟完成数
  uint64 failed_last_minute = 9;
  
  // 延迟统计 (毫秒)
  uint64 avg_queue_time_ms = 10;
  uint64 avg_execution_time_ms = 11;
  uint64 p50_execution_time_ms = 12;
  uint64 p95_execution_time_ms = 13;
  uint64 p99_execution_time_ms = 14;
  
  // 资源使用
  double cluster_cpu_usage = 15;       // 集群 CPU 使用率
  double cluster_memory_usage = 16;    // 集群内存使用率
  double cluster_disk_usage = 17;      // 集群磁盘使用率
  
  // 时间戳
  int64 timestamp_ms = 18;
}

// Worker 详情请求
message WorkerDetailRequest {
  string worker_id = 1;
}

message WorkerDetailResponse {
  bool found = 1;
  WorkerInfo worker = 2;
  repeated TaskInfo active_tasks = 3;  // 当前正在执行的任务
  
  // Worker 历史统计
  uint64 tasks_completed_last_hour = 4;
  uint64 tasks_failed_last_hour = 5;
  uint64 avg_execution_time_ms = 6;
}

// ============================================================================
// CaaS-LSM: CSA Service Messages
// ============================================================================

// 分发任务请求 (推送模式)
message DistributeJobRequest {
  string task_id = 1;
  string db_name = 2;
  uint32 store_id = 3;
  uint64 job_id = 4;
  string compaction_args = 5;      // compaction 参数
  string compaction_addition_info = 6;  // 附加信息
  string shared_fs_uri = 7;
  string shared_fs_local_prefix = 8;
  uint32 timeout_sec = 9;
  int32 start_level = 10;
  double score = 11;
}

message DistributeJobResponse {
  bool accepted = 1;               // 是否接受任务
  string error_message = 2;
}

// CSA 状态请求
message CSAStatusRequest {}

message CSAStatusResponse {
  uint32 local_task_nums = 1;      // 当前正在执行的任务数
  double memory_free_ratio = 2;    // 内存空闲率
  uint64 total_memory_mb = 3;
  uint64 used_memory_mb = 4;
  uint64 total_disk_mb = 5;
  uint64 used_disk_mb = 6;
  bool is_healthy = 7;             // 是否健康
}

// 取消任务请求
message CancelRunningTaskRequest {
  string task_id = 1;
  string reason = 2;
}

message CancelRunningTaskResponse {
  bool success = 1;
  string error_message = 2;
}

// ============================================================================
// Bulk Load Common Types - 批量加载公共类型
// ============================================================================

// 数据源类型
enum DataSourceType {
  DATA_SOURCE_KV_FILE = 0;       // 原始 KV 文件
  DATA_SOURCE_SST_FILE = 1;      // 已有 SST 文件（直接注入）
  DATA_SOURCE_RDB_FILE = 2;      // Redis RDB 文件
  DATA_SOURCE_TENDIS_DUMP = 3;   // TendisPlus dump 文件
  DATA_SOURCE_SNAPSHOT = 4;      // 另一个 TendisPlus 实例的快照
}

// 数据格式
enum DataFormat {
  FORMAT_TENDISPLUS_ENCODED = 0;  // TendisPlus RecordKey/RecordValue 编码
  FORMAT_RAW_KV = 1;              // 原始 key-value（需要编码转换）
  FORMAT_SST_NATIVE = 2;          // 原生 RocksDB SST 文件
}

// 分片策略
enum ShardingStrategy {
  SHARD_BY_KEY_RANGE = 0;     // 按 key 范围切分
  SHARD_BY_SLOT = 1;          // 按 TendisPlus slot 切分
  SHARD_BY_SIZE = 2;          // 按数据量均分
  SHARD_AUTO = 3;             // 自动选择
}

// 压缩类型
enum CompressionType {
  COMPRESS_NONE = 0;
  COMPRESS_SNAPPY = 1;
  COMPRESS_ZLIB = 2;
  COMPRESS_LZ4 = 3;
  COMPRESS_ZSTD = 4;
}

// Bulk Load 阶段
enum BulkLoadPhase {
  PHASE_CREATED = 0;           // 任务已创建
  PHASE_PLANNING = 1;          // 分片规划中
  PHASE_QUEUED = 2;            // 子任务已入队
  PHASE_SST_GENERATING = 3;    // SST 文件生成中
  PHASE_INGESTING = 4;         // SST 文件注入中
  PHASE_COMPLETED = 5;         // 完成
  PHASE_FAILED = 6;            // 失败
  PHASE_CANCELLED = 7;         // 已取消
}

// Key 范围
message BulkLoadKeyRange {
  bytes start_key = 1;     // 起始 key (inclusive)
  bytes end_key = 2;       // 结束 key (exclusive)
  uint32 slot_start = 3;   // 起始 slot
  uint32 slot_end = 4;     // 结束 slot
}

// SST 文件元数据
message SSTFileMetadataProto {
  string file_path = 1;            // 共享存储上的 SST 文件路径
  string column_family = 2;        // 目标 CF 名称 ("default" / "binlog")
  uint64 file_size = 3;            // 文件大小 (bytes)
  uint64 num_entries = 4;          // KV 条目数
  bytes smallest_key = 5;          // 最小 key
  bytes largest_key = 6;           // 最大 key
  string checksum = 7;             // 文件校验和 (SHA256)
}

// Bulk Load 分片信息
message BulkLoadShardInfoProto {
  string shard_id = 1;
  uint32 shard_index = 2;                 // 分片序号
  BulkLoadKeyRange key_range = 3;         // 负责的 key 范围
  string source_path = 4;                 // 数据源路径（分片后的子路径）
  uint64 estimated_size = 5;              // 预估数据量 (bytes)
  uint64 estimated_rows = 6;              // 预估行数
  TaskStatus status = 7;                  // 分片执行状态
  string assigned_worker_id = 8;          // 分配的 Worker
  repeated SSTFileMetadataProto generated_sst_files = 9;  // 生成的 SST 文件
  string error_message = 10;              // 错误信息
}

// Bulk Load 任务参数
message BulkLoadTaskParamsProto {
  // 数据源配置
  DataSourceType source_type = 1;    // 数据源类型
  string source_path = 2;            // 数据源路径/URI
  DataFormat data_format = 3;        // 数据格式

  // 分片配置
  ShardingStrategy sharding_strategy = 4;  // 分片策略
  int32 shard_count = 5;                   // 目标分片数 (0 = 自动)
  repeated BulkLoadKeyRange key_ranges = 6;  // 手动指定的 key 范围

  // 目标配置
  uint32 target_store_id = 7;        // 目标 store ID
  string target_db_path = 8;         // 目标 DB 路径
  string shared_fs_uri = 9;          // 共享文件系统 URI
  string sst_output_dir = 10;        // SST 输出目录（共享存储上）

  // 执行配置
  CompressionType compression = 11;  // SST 压缩算法
  uint64 target_sst_size = 12;      // 目标 SST 文件大小 (bytes)
  bool generate_binlog = 13;         // 是否生成 binlog SST
  bool verify_checksum = 14;         // 注入前校验
  uint32 timeout_sec = 15;           // 超时时间 (秒)

  // 资源控制
  int64 rate_limit_bytes_per_sec = 16;  // 速率限制 (0 = 不限制)
  int32 max_concurrent_ingests = 17;    // 最大并发注入数

  // 状态信息
  BulkLoadPhase phase = 18;           // 当前阶段
  repeated BulkLoadShardInfoProto shards = 19;  // 分片列表
  uint32 completed_shards = 20;       // 已完成分片数
  uint32 failed_shards = 21;          // 失败分片数
}

// ============================================================================
// Bulk Load API Messages - 批量加载接口消息
// ============================================================================

// 提交 Bulk Load 任务请求
message SubmitBulkLoadRequest {
  string source_node_id = 1;            // TendisPlus 节点 ID
  string db_name = 2;                   // 数据库名称
  BulkLoadTaskParamsProto params = 3;   // Bulk Load 参数
  TaskPriority priority = 4;            // 任务优先级
}

message SubmitBulkLoadResponse {
  bool success = 1;
  string task_id = 2;                   // 分配的任务 ID
  string error_message = 3;
}

// 查询 Bulk Load 状态请求
message QueryBulkLoadRequest {
  string task_id = 1;
}

message QueryBulkLoadResponse {
  bool found = 1;
  string task_id = 2;
  TaskStatus overall_status = 3;           // 整体任务状态
  BulkLoadPhase phase = 4;                 // 当前阶段
  uint32 total_shards = 5;                 // 总分片数
  uint32 completed_shards = 6;             // 已完成分片数
  uint32 failed_shards = 7;               // 失败分片数
  uint32 running_shards = 8;              // 进行中分片数
  repeated BulkLoadShardInfoProto shards = 9;  // 分片详情
  repeated SSTFileMetadataProto all_sst_files = 10;  // 所有生成的 SST 文件
  double progress_percent = 11;            // 进度百分比
  string error_message = 12;
}

// 取消 Bulk Load 请求
message CancelBulkLoadRequest {
  string task_id = 1;
  string reason = 2;
}

message CancelBulkLoadResponse {
  bool success = 1;
  string error_message = 2;
  uint32 cancelled_shards = 3;            // 已取消的分片数
}

// TendisPlus 上报 SST 注入结果请求
message ReportIngestResultRequest {
  string task_id = 1;
  string source_node_id = 2;             // TendisPlus 节点 ID
  bool success = 3;                       // 注入是否成功
  uint32 ingested_sst_count = 4;         // 已注入的 SST 文件数
  uint64 ingested_bytes = 5;              // 已注入的数据量 (bytes)
  uint64 ingested_rows = 6;              // 已注入的行数
  string error_message = 7;              // 失败时的错误信息
  uint64 ingest_time_ms = 8;             // 注入耗时 (毫秒)
}

message ReportIngestResultResponse {
  bool success = 1;
  string error_message = 2;
}

// ============================================================================
// CSA Bulk Load Shard Execution Messages
// ============================================================================

// 执行 Bulk Load 分片请求 (Control Plane → CSA Worker 推送模式)
message BulkLoadShardRequest {
  string task_id = 1;                     // 父任务 ID
  string shard_id = 2;                    // 分片 ID
  uint32 shard_index = 3;                 // 分片序号

  // 数据源信息
  DataSourceType source_type = 4;
  string source_path = 5;                // 数据源路径
  DataFormat data_format = 6;

  // Key 范围
  BulkLoadKeyRange key_range = 7;

  // SST 生成配置
  string shared_fs_uri = 8;              // 共享文件系统 URI
  string sst_output_dir = 9;             // SST 输出目录
  CompressionType compression = 10;
  uint64 target_sst_size = 11;           // 目标 SST 文件大小
  bool generate_binlog = 12;             // 是否生成 binlog SST
  uint32 target_store_id = 13;           // 目标 store ID
  string target_db_path = 14;            // 目标 DB 路径

  // 资源控制
  int64 rate_limit_bytes_per_sec = 15;
  uint32 timeout_sec = 16;
}

message BulkLoadShardResponse {
  bool accepted = 1;                      // 是否接受任务
  string error_message = 2;

  // 生成结果（异步完成后通过 ReportTaskResult 上报详细结果）
  repeated SSTFileMetadataProto generated_sst_files = 3;
  uint64 total_rows_processed = 4;
  uint64 total_bytes_written = 5;
  uint64 execution_time_ms = 6;
}

// ============================================================================
// Observatory Enhanced API Messages - 增强观测接口消息
// ============================================================================

// 告警级别
enum AlertSeverity {
  ALERT_INFO = 0;
  ALERT_WARNING = 1;
  ALERT_CRITICAL = 2;
}

// 告警状态
enum AlertState {
  ALERT_INACTIVE = 0;
  ALERT_FIRING = 1;
  ALERT_RESOLVED = 2;
}

// 告警事件
message AlertEventProto {
  string event_id = 1;
  string rule_id = 2;
  string rule_name = 3;
  AlertSeverity severity = 4;
  AlertState state = 5;
  string metric = 6;
  double current_value = 7;
  double threshold = 8;
  string operator_str = 9;
  int64 timestamp_ms = 10;
  string message = 11;
}

// 告警规则
message AlertRuleProto {
  string rule_id = 1;
  string name = 2;
  string description = 3;
  string metric = 4;
  string operator_str = 5;
  double threshold = 6;
  AlertSeverity severity = 7;
  uint32 duration_sec = 8;
  bool enabled = 9;
  AlertState state = 10;
  double last_value = 11;
}

// 获取告警请求
message GetAlertsRequest {
  bool active_only = 1;           // 只返回活跃告警
  uint32 history_limit = 2;       // 历史记录最大数量
}

message GetAlertsResponse {
  repeated AlertEventProto active_alerts = 1;
  repeated AlertEventProto alert_history = 2;
  uint32 total_active = 3;
  uint32 info_count = 4;
  uint32 warning_count = 5;
  uint32 critical_count = 6;
}

// 获取告警规则请求
message GetAlertRulesRequest {}

message GetAlertRulesResponse {
  repeated AlertRuleProto rules = 1;
}

// 追踪 Span
message TraceSpanProto {
  string span_id = 1;
  string trace_id = 2;
  string parent_span_id = 3;
  string operation = 4;
  string component = 5;
  string worker_id = 6;
  int64 start_time_ms = 7;
  int64 end_time_ms = 8;
  int64 duration_ms = 9;
  string status = 10;              // "OK" / "Error" / "Timeout"
  string error_message = 11;
  map<string, string> tags = 12;
}

// 任务追踪
message TaskTraceProto {
  string trace_id = 1;
  string task_type = 2;
  string source_node_id = 3;
  int64 start_time_ms = 4;
  int64 end_time_ms = 5;
  int64 total_duration_ms = 6;
  bool is_complete = 7;
  string final_status = 8;
  repeated TraceSpanProto spans = 9;
  int64 queue_duration_ms = 10;
  int64 schedule_duration_ms = 11;
  int64 execute_duration_ms = 12;
  int64 transfer_duration_ms = 13;
}

// 获取任务追踪请求
message GetTaskTraceRequest {
  string task_id = 1;
}

message GetTaskTraceResponse {
  bool found = 1;
  TaskTraceProto trace = 2;
}

// 获取最近追踪请求
message GetRecentTracesRequest {
  uint32 limit = 1;
  bool slow_only = 2;               // 只返回慢查询
  uint64 slow_threshold_ms = 3;     // 慢查询阈值 (毫秒)
  bool failed_only = 4;             // 只返回失败的
}

message GetRecentTracesResponse {
  repeated TaskTraceProto traces = 1;
  uint32 total_traces = 2;
  uint32 active_traces = 3;
}

// Prometheus 指标请求
message PrometheusMetricsRequest {}

message PrometheusMetricsResponse {
  string metrics_text = 1;          // Prometheus 文本格式
}
