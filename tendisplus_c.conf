# Tendisplus Configuration for Remote Compaction
# ================================================

# Basic server settings
port 51002
daemon off
loglevel notice
logdir ./home/log
dumpdir ./home/dump
dir ./home/db
pidfile ./home/tendisplus.pid
slowlog ./home/log/slowlog

# Performance settings
rocks.blockcachemb 4096
executorThreadNum 48
kvStoreCount 1

# ================================================
# NFS/Shared Storage Configuration
# ================================================
# Enable NFS for shared storage mode (yes/no)
nfs.enabled yes

# NFS server URL
# Format: nfs://hostname_or_ip/export_path
# Examples:
#   nfs://localhost/shared/rocksdb       - Local NFS for testing
#   nfs://192.168.1.100/data/rocksdb     - Remote NFS server
#   nfs://nfs-server.internal/exports/db - Internal DNS name
nfs.url nfs://localhost/shared/rocksdb

# Local path prefix
# All paths starting with this prefix will be mapped to NFS
nfs.local_prefix ./home/db

# ================================================
# Remote Compaction Service (CSA) Configuration
# ================================================
# CSA server address (host:port)
# This is the gRPC endpoint of the Compaction Service Agent
csa_address localhost:8010

# Remote compaction mode:
#   shared_storage   - Use shared filesystem (NFS/HDFS/S3)
#                      Both Tendis and CSA access the same files via shared storage
#                      Requires: nfs.enabled=yes and proper NFS configuration
#
#   network_transfer - Transfer SST files over network (gRPC streaming)
#                      No shared storage needed
#                      Files are uploaded to CSA, compacted, then downloaded
#                      Better for environments without shared filesystem
remote_compaction.mode shared_storage

# ================================================
# Network Transfer Mode Settings
# (Only used when remote_compaction.mode = network_transfer)
# ================================================
# CSA server working directory for temporary files
remote_compaction.csa_work_dir /tmp/csa_work

# File transfer chunk size in bytes (default: 4MB)
# Larger chunks = fewer round trips but more memory usage
remote_compaction.file_transfer_chunk_size 4194304

# Timeout for file transfer operations in seconds
remote_compaction.file_transfer_timeout 300

# Number of retries for failed file transfers
remote_compaction.file_transfer_retries 3

# ================================================
# CSA Server Settings
# ================================================
# Maximum concurrent compaction tasks on CSA server
remote_compaction.csa_max_concurrent_tasks 5

# Connection timeout in seconds
remote_compaction.csa_connection_timeout 30

# Request timeout in seconds (for compaction operations)
remote_compaction.csa_request_timeout 600

# ================================================
# RocksDB Compaction Settings
# ================================================
# Maximum number of threads for parallel subcompactions
# Default: 2
# rocks.max_subcompactions 2

# Direct I/O settings (uncomment to enable)
# rocks.use_direct_io_for_flush_and_compaction 1
# rocks.use_direct_reads 1
