# tendisplus configuration for testing
port 51002
daemon off
loglevel notice
# logdir /mnt/nfs_rocksdb/log
# dumpdir /mnt/nfs_rocksdb/dump
# dir /mnt/nfs_rocksdb/db
# pidfile /mnt/nfs_rocksdb/tendisplus.pid
# slowlog /mnt/nfs_rocksdb/log/slowlog
logdir ./home/log
dumpdir ./home/dump
dir ./home/db
pidfile ./home/tendisplus.pid
slowlog ./home/log/slowlog

# 是否启用NFS存储 (yes/no)
nfs.enabled yes

# NFS服务器URL
# 格式: nfs://hostname_or_ip/export_path
nfs.url nfs://localhost/shared/rocksdb

# 本地路径前缀
# 所有以此前缀开头的路径会被映射到NFS
nfs.local_prefix ./home/db
csa_address localhost:8010
# rocks.use_direct_io_for_flush_and_compaction 1
# rocks.use_direct_reads 1
rocks.blockcachemb 4096
executorThreadNum 48
kvStoreCount 1
# This value represents the maximum number of threads that will
# concurrently perform a compaction job by breaking it into multiple,
# smaller ones that are run simultaneously.
# Default: 2
# rocks.max_subcompactions 2
