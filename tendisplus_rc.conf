# Tendisplus Configuration for Remote Compaction
# ================================================
# This configuration enables remote compaction using shared storage (NFS/HDFS)
# Both Tendisplus and CSA access the same files via shared filesystem

# Basic server settings
port 51002
daemon off
loglevel notice
logdir ./home/log
dumpdir ./home/dump
dir ./home/db
pidfile ./home/tendisplus.pid
slowlog ./home/log/slowlog

# Performance settings
rocks.blockcachemb 4096
executorThreadNum 48
kvStoreCount 1
rocks.max_background_compactions 1
rocks.max_total_wal_size 1024MB     
rocks.wal_ttl_seconds 3600
rocks.keep_log_file_num 10
# ================================================
# Remote Compaction Service (CSA) Configuration
# ================================================
# CaaS-LSM Architecture:
#   Tendisplus -> Control Plane -> Multiple CSA Workers
#
# Tendisplus connects to Control Plane (scheduler/coordinator)
# Control Plane manages multiple CSA Workers (executors)

# Control Plane address (REQUIRED to enable remote compaction)
# Tendisplus submits compaction tasks to Control Plane
# Control Plane dispatches tasks to available CSA Workers
# Format: host:port
# Examples:
#   localhost:9010                  - Local Control Plane for testing
#   192.168.1.100:9010              - Remote Control Plane
#   control-plane.internal:9010     - Using DNS name
# Leave empty to disable remote compaction
control_plane_address localhost:9010

# [DEPRECATED] csa_address - Direct CSA connection (old mode)
# Use control_plane_address instead for multi-worker setup
# csa_address is only for single-worker testing without Control Plane
# csa_address localhost:8010

# Shared filesystem URI (REQUIRED for remote compaction)
# Format: scheme://host/path
# Supported schemes: nfs://, hdfs://, s3://, gcs://
# Examples:
#   nfs://localhost/shared/rocksdb       - Local NFS for testing
#   nfs://192.168.1.100/data/rocksdb     - Remote NFS server
#   hdfs://namenode:9000/data/rocksdb    - HDFS filesystem
#   s3://bucket-name/prefix               - S3 filesystem
# Leave empty to disable shared filesystem
remote_compaction.shared_fs_uri nfs://localhost/shared/rocksdb

# Local path prefix (OPTIONAL - can be auto-inferred)
# This is the local mount point where shared filesystem is mounted
# All paths starting with this prefix will be automatically converted to shared filesystem URIs
# 
# If NOT set (recommended for simple setups):
#   - System will automatically infer from "dir" path
#   - Example: dir=./home/db -> inferred prefix=./home
#   - This simplifies configuration for most use cases
#
# If SET (for complex setups or explicit control):
#   - Use this exact prefix for path matching
#   - Example: remote_compaction.shared_fs_local_prefix=/mnt/rocksdb, dir=/mnt/rocksdb/db
#   - All paths under /mnt/rocksdb will use shared filesystem
#
# How it works:
#   - RocksDB uses local paths (e.g., ./home/db)
#   - SharedFileSystem automatically converts matching paths to URIs
#   - Example: ./home/db -> nfs://localhost/shared/rocksdb/db (internal)
#   - No changes needed to RocksDB configuration
#
# Leave empty to enable auto-inference (recommended)
# remote_compaction.shared_fs_local_prefix ./home

# ================================================
# Remote Compaction Advanced Settings
# ================================================
# These settings have reasonable defaults and usually don't need to be changed
# Set to 0 to use default values

# Maximum concurrent compaction tasks on CSA server
# Default: 5
# Higher values allow more parallel compactions but use more resources
# Set to 0 to use default (5)
remote_compaction.max_concurrent_tasks 5

# Maximum gRPC message size in bytes
# Default: 16777216 (16MB)
# Increase if you have very large compaction results
# Set to 0 to use default (16MB)
# Examples:
#   16777216   - 16MB (default)
#   33554432   - 32MB
#   67108864   - 64MB
remote_compaction.grpc_max_message_size 16777216

# Check time interval in seconds
# Default: 1
# Used for internal scheduling checks
# Set to 0 to use default (1)
remote_compaction.check_time_interval 1

# Maximum reschedule times
# Default: 5
# Maximum number of times a compaction task can be rescheduled
# Set to 0 to use default (5)
remote_compaction.max_reschedule 5

# ================================================
# HDFS Configuration (Optional, only if using HDFS)
# ================================================
# These settings are only used when HDFS is enabled
# Leave empty if not using HDFS

# HDFS address
# Format: hdfs://host:port/path
# Example: hdfs://namenode:9000/
# remote_compaction.hdfs_address 

# Pro compaction address
# Format: host:port
# Example: 192.168.1.100:8020
# remote_compaction.pro_cp_address 

# Maximum accumulation in pro compaction
# Default: 5
# Set to 0 to use default (5)
# remote_compaction.max_accumulation_in_procp 5

# ================================================
# RocksDB Compaction Settings
# ================================================
# Maximum number of threads for parallel subcompactions
# Default: 2
# Uncomment to customize
# rocks.max_subcompactions 2

# Direct I/O settings (uncomment to enable for better performance)
# rocks.use_direct_io_for_flush_and_compaction 1
# rocks.use_direct_reads 1

# ================================================
# Quick Start Guide
# ================================================
# CaaS-LSM Architecture Setup:
#
# 1. Setup shared filesystem (NFS/HDFS/S3)
#    - Ensure shared filesystem is accessible from all nodes
#    - All Tendisplus nodes and CSA Workers must access the same shared storage
#
# 2. Start Control Plane (Scheduler)
#    - Build: control_plane_server executable
#    - Run: ./control_plane_server --port=9010
#    - Control Plane manages task scheduling and worker coordination
#
# 3. Start CSA Workers (Compaction Executors)
#    - Build: csa_server executable  
#    - Run on each worker node:
#      ./csa_server --port=8010 --control_plane=localhost:9010
#    - Workers register themselves to Control Plane automatically
#    - Can scale out by adding more CSA Workers
#
# 4. Configure Tendisplus (This file)
#    - Set control_plane_address to your Control Plane address
#    - Set remote_compaction.shared_fs_uri to your shared filesystem URI
#    - Tendisplus submits tasks to Control Plane
#    - Control Plane dispatches to available Workers
#
# Architecture:
#   ┌─────────────┐      ┌─────────────────┐      ┌─────────────┐
#   │ Tendisplus  │─────▶│  Control Plane  │─────▶│ CSA Worker1 │
#   │   Node 1    │      │   (Scheduler)   │      ├─────────────┤
#   ├─────────────┤      │                 │─────▶│ CSA Worker2 │
#   │ Tendisplus  │─────▶│ - Task Queue    │      ├─────────────┤
#   │   Node 2    │      │ - Load Balance  │─────▶│ CSA Worker3 │
#   └─────────────┘      │ - Worker Mgmt   │      └─────────────┘
#                        └─────────────────┘
#                               ▲
#                               │ Shared Storage (NFS/HDFS/S3)
#                               ▼
#
# Configuration Examples:
#
# Simple setup (single Control Plane):
#   control_plane_address localhost:9010
#   remote_compaction.shared_fs_uri nfs://localhost/shared/rocksdb
#
# Production setup:
#   control_plane_address control-plane.mycompany.com:9010
#   remote_compaction.shared_fs_uri nfs://nfs-server/data/rocksdb
#
# To disable remote compaction:
#   - Set control_plane_address to empty
#   - System will fallback to local compaction
